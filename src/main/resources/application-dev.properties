
## DataSource Config
spring.datasource.url=jdbc:mysql://localhost:3306/fawatir
spring.datasource.username=root
spring.datasource.password=root

## JPA Config
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_indentifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
##spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.sql.init.continue-on-error=true
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.globally_quoted_identifiers=true

jwt.secret=super_complex_secret

spring.web.error.path=/user/error
spring.web.error.whitelabel.enabled=false

# Image max size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB